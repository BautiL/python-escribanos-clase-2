[project]
name = "tramite-api"
version = "0.1.0"
description = "API de gestion de tramites y documentos (FastAPI + SQLAlchemy async)"
readme = "README.md"
authors = [
    { name = "Juan Ignacio Spadoni", email = "juanynirvana@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
]

[tool.uv]
# Es una aplicacion (se corre con `fastapi run main.py`), no una libreria para empaquetar.
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]
